<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Dashboard — Захищений доступ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#0f1424 0%,#1a2342 100%);
  color:#e8ecf7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.gate{background:#1b2440;border:1px solid #2a3658;border-radius:16px;
  padding:38px 38px 32px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gate h1{font-size:21px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.gate .sub{color:#9aa6c7;font-size:13px;margin-bottom:22px;line-height:1.5}
.gate label{display:block;color:#6b779c;font-size:11px;
  text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.gate input{width:100%;padding:11px 14px;font-size:14px;background:#0f1424;color:#fff;
  border:1px solid #2a3658;border-radius:9px;outline:none;
  font-family:inherit;transition:border-color .15s}
.gate input:focus{border-color:#5b8cff}
.gate button{width:100%;margin-top:14px;padding:12px;
  background:#5b8cff;color:#fff;border:none;border-radius:9px;
  font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.gate button:hover{background:#4a7bee}
.gate button:disabled{background:#2a3658;cursor:wait}
.err{background:rgba(255,93,108,.14);color:#ff5d6c;padding:9px 12px;
  border-radius:7px;font-size:12.5px;margin-top:12px;display:none}
.err.show{display:block}
.brand{display:flex;align-items:center;gap:8px;color:#6b779c;font-size:11px;
  margin-top:22px;padding-top:18px;border-top:1px solid #2a3658;
  text-transform:uppercase;letter-spacing:.5px}
.brand .dot{width:6px;height:6px;background:#2ecc8f;border-radius:50%}
</style>
</head>
<body>
<div class="gate">
  <h1>P&L Доставки 2026</h1>
  <div class="sub">Доступ до дашборду захищений паролем. Введіть пароль, щоб переглянути.</div>
  <form id="loginForm" onsubmit="return doLogin(event)">
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="off" autofocus required>
    <button id="submitBtn" type="submit">Увійти</button>
    <div class="err" id="err">Невірний пароль</div>
  </form>
  <div class="brand"><span class="dot"></span><span>AES-256-GCM · PBKDF2 600k</span></div>
</div>

const b64dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptDashboard(password) {
  const salt = b64dec(BLOB.salt);
  const iv = b64dec(BLOB.iv);
  const ct = b64dec(BLOB.ct);
  const enc = new TextEncoder();
  const pwKey = await crypto.subtle.importKey(
    'raw', enc.encode(password),
    { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: BLOB.iter, hash: 'SHA-256' },
    pwKey,
    { name: 'AES-GCM', length: 256 },
    false, ['decrypt']
  );
  const plaintext = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv }, key, ct
  );
  return new TextDecoder().decode(plaintext);
}

async function doLogin(e) {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Розшифровую...';
  try {
    const html = await decryptDashboard(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Увійти';
    const inp = document.getElementById('pw');
    inp.focus();
    inp.select();
  }
  return false;
}
</script>
